
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchDay - Football</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #080b12;
    --panel: #121824;
    --border: rgba(255,255,255,.09);
    --text: #f5f7fb;
    --muted: #929db0;
    --green: #35e58a;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
}

header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: #0c111b;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.brand {
    font-size: 22px;
    font-weight: 800;
}

.brand span { color: var(--green); }

button, select, input {
    font: inherit;
}

button { cursor: pointer; }

main {
    max-width: 1100px;
    padding: 28px 20px 60px;
    margin: auto;
}

.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

h1 { font-size: 30px; margin: 0; }
.subtitle { color: var(--muted); margin-top: 8px; }

.date-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.date-controls button, .date-controls input {
    background: var(--panel);
    color: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
}

.date-controls input { max-width: 165px; }

.tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

.tab {
    padding: 12px 17px;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: #c1cada;
    background: var(--panel);
    font-weight: 650;
}

.tab.active {
    background: var(--green);
    color: #07130c;
    border-color: var(--green);
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}

.panel h2 {
    font-size: 17px;
    margin: 0 0 16px;
}

.selectors {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
}

select, .play-button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
}

select {
    background: #0c111b;
    color: white;
}

.play-button {
    margin-top: 14px;
    background: var(--green);
    color: #06140c;
    border: none;
    font-weight: 800;
}

.play-button:hover { filter: brightness(1.08); }

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.section-heading h2 { margin: 0; font-size: 19px; }

#matchList {
    display: grid;
    gap: 12px;
}

.match-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 17px;
    display: grid;
    grid-template-columns: 100px minmax(0, 1fr) 145px;
    gap: 16px;
    align-items: center;
}

.match-time {
    font-weight: 800;
    font-size: 18px;
}

.match-time small {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    margin-top: 5px;
}

.match-teams { min-width: 0; }

.team-name {
    font-size: 14px;
    font-weight: 700;
    overflow-wrap: anywhere;
}

.vs {
    color: var(--muted);
    font-size: 11px;
    margin: 5px 0;
}

.competition {
    color: var(--muted);
    font-size: 12px;
    margin-top: 7px;
}

.watch-button {
    background: var(--green);
    border: none;
    color: #06140c;
    border-radius: 10px;
    padding: 12px;
    font-weight: 800;
}

.empty {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
}

#player {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: black;
}

#player.active { display: block; }

#matchFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.close-player {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 101;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.8);
    color: white;
    font-size: 22px;
}

@media (max-width: 700px) {
    main { padding: 22px 13px 40px; }
    h1 { font-size: 25px; }
    .selectors { grid-template-columns: 1fr; }
    .match-card {
        grid-template-columns: 70px minmax(0, 1fr);
        gap: 12px;
    }
    .watch-button {
        grid-column: 1 / -1;
    }
    .date-controls { flex-wrap: wrap; }
}
</style>
</head>

<body>
<header>
    <div class="header-inner">
        <div class="brand">⚽ Match<span>Day</span></div>
        <button class="tab" onclick="resetDate()">📅 Today</button>
    </div>
</header>

<main>
    <section class="hero">
        <div>
            <h1>Football Match Centre</h1>
            <div class="subtitle">Choose a competition, find a match and open its stream.</div>
        </div>

        <div class="date-controls">
            <button onclick="changeDate(-1)" aria-label="Previous day">‹</button>
            <input type="date" id="matchDate" onchange="renderMatches()">
            <button onclick="changeDate(1)" aria-label="Next day">›</button>
        </div>
    </section>

    <nav class="tabs" aria-label="Football competitions">
        <button class="tab active" data-league="epl" onclick="selectLeague('epl')">
            🏴 Premier League
        </button>
        <button class="tab" data-league="la-liga" onclick="selectLeague('la-liga')">
            🇪🇸 La Liga
        </button>
        <button class="tab" data-league="champions-league" onclick="selectLeague('champions-league')">
            ⭐ UEFA Champions League
        </button>
        <button class="tab" data-league="football" onclick="selectLeague('football')">
            🌍 International Football
        </button>
    </nav>

    <section class="panel">
        <h2>Choose a match manually</h2>
        <div class="selectors">
            <select id="team1" aria-label="Home team"></select>
            <select id="team2" aria-label="Away team"></select>
            <select id="server" aria-label="Stream server">
                <option value="stream-1">Server 1</option>
                <option value="stream-2">Server 2</option>
                <option value="stream-3">Server 3</option>
            </select>
        </div>
        <button class="play-button" onclick="loadMatch()">▶ Play Selected Match</button>
    </section>

    <div class="section-heading">
        <h2 id="competitionTitle">Premier League</h2>
        <span id="dateLabel" class="subtitle"></span>
    </div>

    <div id="matchList">
        <div class="empty">Select a competition and date to see matches.</div>
    </div>
</main>

<div id="player">
    <button class="close-player" onclick="closePlayer()" aria-label="Close player">×</button>
    <iframe id="matchFrame" allowfullscreen allowtransparency
        scrolling="no" referrerpolicy="unsafe-url"></iframe>
</div>

<script>
const leagues = {
    "epl": [
        "Arsenal", "Aston Villa", "Bournemouth", "Brentford",
        "Brighton and Hove Albion", "Burnley", "Chelsea",
        "Crystal Palace", "Everton", "Fulham", "Leeds United",
        "Liverpool", "Manchester City", "Manchester United",
        "Newcastle United", "Nottingham Forest", "Sunderland",
        "Tottenham Hotspur", "West Ham United", "Wolverhampton Wanderers"
    ],

    "la-liga": [
        "Alaves", "Athletic Bilbao", "Atletico Madrid", "Barcelona",
        "Celta Vigo", "Elche", "Espanyol", "Getafe", "Girona",
        "Levante", "Mallorca", "Osasuna", "Rayo Vallecano",
        "Real Betis", "Real Madrid", "Real Oviedo", "Real Sociedad",
        "Sevilla", "Valencia", "Villarreal"
    ],

    "champions-league": [
        "Arsenal", "Atletico Madrid", "Barcelona", "Bayern Munich",
        "Bodoe Glimt", "Borussia Dortmund", "Club Brugge",
        "Como", "Fenerbahce", "Galatasaray", "Inter Milan",
        "LASK", "Lens", "Lille", "Liverpool", "Manchester City",
        "Manchester United", "Napoli", "Paris Saint Germain",
        "PSV Eindhoven", "Real Betis", "Real Madrid", "Roma",
        "Slavia Prague", "Sporting CP", "Villarreal"
    ],

    "football": [
        "Argentina", "Australia", "Austria", "Belgium", "Brazil",
        "Canada", "Chile", "China", "Colombia", "Croatia",
        "Czechia", "Denmark", "Egypt", "England", "Finland",
        "France", "Germany", "Ghana", "Greece", "India",
        "Indonesia", "Iran", "Iraq", "Ireland", "Italy",
        "Ivory Coast", "Japan", "Mexico", "Morocco",
        "Netherlands", "New Zealand", "Nigeria", "Northern Ireland",
        "Norway", "Poland", "Portugal", "Qatar", "Romania",
        "Saudi Arabia", "Scotland", "Senegal", "Serbia",
        "South Africa", "South Korea", "Spain", "Sweden",
        "Switzerland", "Turkey", "Ukraine", "United States", "Uruguay", "Wales"
    ]
};

const leagueNames = {
    "epl": "Premier League",
    "la-liga": "La Liga",
    "champions-league": "UEFA Champions League",
    "football": "International Football"
};

let currentLeague = "epl";

const team1 = document.getElementById("team1");
const team2 = document.getElementById("team2");
const server = document.getElementById("server");
const matchDate = document.getElementById("matchDate");
const matchList = document.getElementById("matchList");

function formatTeam(team) {
    const specialNames = {
        "Brighton and Hove Albion": "brighton-hove-albion",
        "Paris Saint Germain": "paris-saint-germain",
        "Bodoe Glimt": "bodo-glimt",
        "Inter Milan": "inter-milan"
    };

    if (specialNames[team]) return specialNames[team];

    return team.toLowerCase()
        .replace(/&/g, "and")
        .replace(/['’]/g, "")
        .replace(/[^a-z0-9\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
}

function populateTeams() {
    const teams = leagues[currentLeague];

    team1.replaceChildren(new Option("Select home team", ""));
    team2.replaceChildren(new Option("Select away team", ""));

    teams.forEach(team => {
        team1.add(new Option(team, team));
        team2.add(new Option(team, team));
    });
}

function selectLeague(league) {
    currentLeague = league;

    document.querySelectorAll("[data-league]").forEach(button => {
        button.classList.toggle("active", button.dataset.league === league);
    });

    document.getElementById("competitionTitle").textContent = leagueNames[league];
    populateTeams();
    renderMatches();
}

function getStreamUrl(home, away, selectedServer) {
    const path = currentLeague === "champions-league" ||
                 currentLeague === "football"
        ? "football"
        : currentLeague;

    return `https://embedsports.me/${path}/${formatTeam(home)}-vs-${formatTeam(away)}-${selectedServer}`;
}

function loadMatch() {
    if (!team1.value || !team2.value) {
        alert("Please select both teams.");
        return;
    }

    if (team1.value === team2.value) {
        alert("Please select two different teams.");
        return;
    }

    openPlayer(getStreamUrl(team1.value, team2.value, server.value));
}

function openPlayer(url) {
    document.getElementById("matchFrame").src = url;
    document.getElementById("player").classList.add("active");
}

function closePlayer() {
    document.getElementById("matchFrame").src = "";
    document.getElementById("player").classList.remove("active");
}

function changeDate(days) {
    const parts = matchDate.value.split("-").map(Number);
    const date = new Date(parts[0], parts[1] - 1, parts[2]);
    date.setDate(date.getDate() + days);
    matchDate.value = toDateInput(date);
    renderMatches();
}

function toDateInput(date) {
    const pad = n => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function resetDate() {
    matchDate.value = toDateInput(new Date());
    renderMatches();
}

/*
 * This page currently supports manual match selection.
 * To populate a real timetable, connect a fixtures API.
 * The stream URL pattern alone cannot supply fixture dates
 * or determine which matches are scheduled on a given day.
 */
function renderMatches() {
    document.getElementById("dateLabel").textContent = matchDate.value;

    matchList.innerHTML = `
        <div class="empty">
            <div style="font-size:32px;margin-bottom:10px">📅</div>
            <strong>No automatic fixtures source connected</strong>
            <p>Choose the teams above and click “Play Selected Match”.</p>
            <p>Selected competition: ${leagueNames[currentLeague]}</p>
            <p>Selected date: ${matchDate.value}</p>
        </div>
    `;
}

matchDate.value = toDateInput(new Date());
populateTeams();
renderMatches();
</script>
</body>
</html>
